app-id: app.javelin.JavelinMail
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
command: javelin-flatpak

build-options:
  strip: true

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=app.javelin.JavelinMail.StatusNotifierItem
  - --env=QTWEBENGINE_DISABLE_SANDBOX=1

modules:
  - name: boost-pfr
    buildsystem: simple
    build-commands:
      - install -d /app/include/boost
      - cp -a include/boost/pfr /app/include/boost/
    sources:
      - type: archive
        url: https://github.com/boostorg/pfr/archive/refs/tags/boost-1.88.0.tar.gz
        sha256: 56104541553dddb94079f66376a38b965cb2d9fc3e3b15fc0ea0fbfdfc56a6e6

  - name: openblas
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} DYNAMIC_ARCH=1 NO_STATIC=1 NO_LAPACKE=1 USE_OPENMP=0 shared
      - make PREFIX=/app NO_STATIC=1 NO_LAPACKE=1 install
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.34/OpenBLAS-0.3.34.tar.gz
        sha256: cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed

  - name: gpgme
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://gnupg.org/ftp/gcrypt/gpgme/gpgme-2.1.2.tar.bz2
        sha256: 0687a95b299871c4141f507c0f740de6b429c9ac067d0fa4e062e3264df5fb77

  - name: gpgmepp
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://gnupg.org/ftp/gcrypt/gpgmepp/gpgmepp-2.1.0.tar.xz
        sha256: 57f804468f0204504b172c6b139cb05124b4263be7ad514932c7c4c5062a16e2

  - name: qgpgme
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_WITH_QT5=OFF
      - -DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=ON
    sources:
      - type: archive
        url: https://gnupg.org/ftp/gcrypt/qgpgme/qgpgme-2.2.0.tar.xz
        sha256: 3c6290ff5bfeab981bb48b2951703761f1dbea640cb637beb3560d5fefb0e0b3

  - name: openldap
    buildsystem: autotools
    config-opts:
      - --disable-slapd
      - --disable-static
      - --enable-shared
      - --with-tls=openssl
    sources:
      - type: archive
        url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-2.6.10.tgz
        sha256: c065f04aad42737aebd60b2fe4939704ac844266bc0aeaa1609f0cad987be516

  - name: akonadi
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_PYTHON_BINDINGS=OFF
      - -DDATABASE_BACKEND=SQLITE
    sources:
      - type: git
        url: https://invent.kde.org/pim/akonadi.git
        tag: v26.08.0
        commit: 0c0252f5f33dc29e9e5f107cb330205e716e1e96

  - name: grantleetheme
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/grantleetheme.git
        tag: v26.08.0
        commit: 491a0d6f58ea02a2a60721ee7e46ef35dd3fa810

  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TESTING=OFF
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.15.0.tar.gz
        sha256: f4254dc8f0933b06d90672d683eab08ef770acd8336e44dfa030ce041dc2ca22

  - name: ktextaddons
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_DESIGNERPLUGIN=OFF
      - -DBERGAMOT_TRANSLATOR_PLUGIN=OFF
      - -DSPEAK_TO_TEXT_VOSK_PLUGIN=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/ktextaddons/ktextaddons-2.1.2.tar.xz
        sha256: f3b4448904f1656d6d7cd5a557d22fe1c50624eb32ed369f34726beff9ce0589

  - name: akonadi-contacts
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/akonadi-contacts.git
        tag: v26.08.0
        commit: 87965874a1151603f8ef4b1b95e3a341644ee955

  - name: akonadi-mime
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/akonadi-mime.git
        tag: v26.08.0
        commit: de7031722ba4c2ac7ef9f7eccd9170b80aea64ea

  - name: boost-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DBOOST_INCLUDE_LIBRARIES=graph;pfr
    sources:
      - type: archive
        url: https://github.com/boostorg/boost/releases/download/boost-1.88.0/boost-1.88.0-cmake.tar.xz
        sha256: f48b48390380cfb94a629872346e3a81370dc498896f16019ade727ab72eb1ec

  - name: libkleo
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/libkleo.git
        tag: v26.08.0
        commit: 78b5f554f1e0faef7b97260b97d4f0ca654217bd

  - name: libkgapi
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/libkgapi.git
        tag: v26.08.0
        commit: 80c5549a86c858ab6bc6f09b3877ea155106a166

  - name: ksmtp
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/ksmtp.git
        tag: v26.08.0
        commit: 0cc466b5cea6b11a5cf4af7006e0e3eded5bd2b2

  - name: kmailtransport
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/kmailtransport.git
        tag: v26.08.0
        commit: 3bfed8eb0529f9491576ff13ae1e41dc1445d65b

  - name: kpimtextedit
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_DESIGNERPLUGIN=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/kpimtextedit.git
        tag: v26.08.0
        commit: 65c7eed44a15548fbfd2a2abe7495bfe7259f6ab

  - name: kidentitymanagement
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/kidentitymanagement.git
        tag: v26.08.0
        commit: 7f2f953a550aa7f8053529dcc94d49dd3bce1929

  - name: kldap
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/kldap.git
        tag: v26.08.0
        commit: 021eae271b9d8167d94f7160374ed1993c6e67c9

  - name: kimap
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/kimap.git
        tag: v26.08.0
        commit: 46fb2eb9b61962e7a048a2b843862ffaafa77d2a

  - name: kmbox
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/kmbox.git
        tag: v26.08.0
        commit: a4972afd9f8f6b61ec519bad5386aace308a21e0

  - name: libkdepim
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_DESIGNERPLUGIN=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/libkdepim.git
        tag: v26.08.0
        commit: 2444639505f07076675e9b92ff471af199d3ab37

  - name: pimcommon
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DFORCE_DISABLE_AKONADI_SEARCH=ON
    sources:
      - type: git
        url: https://invent.kde.org/pim/pimcommon.git
        tag: v26.08.0
        commit: 3a96a3b70f7cbbe5ce00cf5a25c584bdf77e0251

  - name: libgravatar
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/pim/libgravatar.git
        tag: v26.08.0
        commit: a4d9975393f8aab4aa794058ac4e19f3d5e43fe5

  - name: messagelib
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DFORCE_DISABLE_AKONADI_SEARCH=ON
    sources:
      - type: git
        url: https://invent.kde.org/pim/messagelib.git
        tag: v26.08.0
        commit: 269f4a2f3ba96b3821404fd08748e0b1263ede86

  - name: javelin-mail
    buildsystem: simple
    build-commands:
      - test -f /app/include/QtWebEngineCore/QWebEngineUrlSchemeHandler
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Wno-error=maybe-uninitialized -DCMAKE_INSTALL_PREFIX=/app -DBUILD_TESTING=OFF -DJAVELIN_ENABLE_LOCAL_DATA_INSTALL=OFF -DJAVELIN_INSTALL_SYSTEMD_USER_SERVICE=OFF -DFETCHCONTENT_SOURCE_DIR_GLAZE=/run/build/javelin-mail/third-party/glaze -DFETCHCONTENT_SOURCE_DIR_FASTTEXT=/run/build/javelin-mail/third-party/fastText -DFETCHCONTENT_SOURCE_DIR_MOZILLA_TRANSLATIONS=/run/build/javelin-mail/third-party/mozilla-translations
      - cmake --build build --parallel ${FLATPAK_BUILDER_N_JOBS}
      - cmake --install build
      - install -Dm755 packaging/flatpak/javelin-flatpak /app/bin/javelin-flatpak
      - rm -rf /app/include /app/lib/cmake /app/lib/pkgconfig
      - find /app -type f '(' -name '*.a' -o -name '*.la' ')' -delete
    post-install:
      - cp /app/share/applications/javelinmail.desktop /app/share/applications/app.javelin.JavelinMail.desktop
      - sed -i 's/^Exec=.*/Exec=javelin-flatpak/' /app/share/applications/app.javelin.JavelinMail.desktop
      - sed -i 's/^Icon=.*/Icon=app.javelin.JavelinMail/' /app/share/applications/app.javelin.JavelinMail.desktop
      - cp /app/share/icons/hicolor/scalable/apps/javelinmail.svg /app/share/icons/hicolor/scalable/apps/app.javelin.JavelinMail.svg
      - sed -i 's#javelinmail.desktop#app.javelin.JavelinMail.desktop#' /app/share/metainfo/app.javelin.JavelinMail.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - AppDir
          - flatpak-build
          - flatpak-repo
          - out
      - type: archive
        url: https://github.com/stephenberry/glaze/archive/refs/tags/v7.9.1.tar.gz
        sha256: d6dee391276f5375672c35d06058e4fd8f1f30f62bae163a004b3bd13a4e2ae3
        dest: third-party/glaze
      - type: archive
        url: https://github.com/facebookresearch/fastText/archive/refs/tags/v0.9.2.tar.gz
        sha256: 7ea4edcdb64bfc6faaaec193ef181bdc108ee62bb6a04e48b2e80b639a99e27e
        dest: third-party/fastText
      - type: git
        url: https://github.com/mozilla/translations.git
        commit: 4732dc947bc952abb019aabfe5582006d4fc3337
        disable-submodules: false
        disable-shallow-clone: true
        dest: third-party/mozilla-translations
